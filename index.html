<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Active Transport Interactive Simulator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f0f4f8;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, #dbeafe 0%, #dbeafe 45%, #fef9c3 55%, #fef9c3 100%);
            border-radius: 0.5rem;
            box-shadow: inset 0 2px 4px 0 rgba(0, 0, 0, 0.06);
        }
        .btn {
            transition: all 0.2s ease-in-out;
        }
        .btn:active:not(:disabled) {
            transform: scale(0.95);
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        .fade-in {
            animation: fadeIn 0.3s ease-in;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="h-screen flex flex-col text-slate-800">

    <header class="bg-blue-600 text-white p-4 shadow-md z-10 shrink-0">
        <div class="max-w-6xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-3">
            <h1 class="text-2xl font-bold tracking-tight">Cellular Transport Simulator</h1>
            <nav class="flex space-x-2">
                <button onclick="setModule('pump')" id="tab-pump" class="btn px-4 py-2 bg-blue-700 hover:bg-blue-800 rounded-md font-semibold text-sm transition-colors ring-2 ring-white ring-offset-2 ring-offset-blue-600">Na+/K+ Pump</button>
                <button onclick="setModule('endo')" id="tab-endo" class="btn px-4 py-2 bg-blue-500 hover:bg-blue-700 rounded-md font-semibold text-sm transition-colors ring-2 ring-transparent ring-offset-2 ring-offset-blue-600">Endocytosis</button>
                <button onclick="setModule('exo')" id="tab-exo" class="btn px-4 py-2 bg-blue-500 hover:bg-blue-700 rounded-md font-semibold text-sm transition-colors ring-2 ring-transparent ring-offset-2 ring-offset-blue-600">Exocytosis</button>
            </nav>
        </div>
    </header>

    <main class="flex-grow flex flex-col md:flex-row max-w-6xl mx-auto w-full p-4 gap-4 overflow-hidden">
        
        <!-- Left Side: Canvas Area -->
        <div class="flex-grow bg-white rounded-xl shadow-lg border border-slate-200 flex flex-col relative overflow-hidden min-h-[400px]">
            <div class="absolute top-4 left-4 bg-white/80 backdrop-blur-sm p-2 rounded shadow-sm border border-slate-200 z-10 pointer-events-none">
                <h2 id="canvas-title" class="font-bold text-lg text-slate-700 mb-1">Sodium-Potassium Pump</h2>
                <div id="legend" class="text-xs text-slate-600 space-y-1"></div>
            </div>

            <!-- Scoreboard -->
            <div id="pump-scoreboard" class="absolute top-4 right-4 bg-white/90 backdrop-blur-sm p-3 rounded shadow-sm border border-slate-200 z-10 pointer-events-none">
                <h3 class="font-bold text-sm text-slate-700 mb-1 border-b pb-1">Transport Stats</h3>
                <div class="text-xs text-slate-600 space-y-1 mt-2">
                    <div>Na+ Moved Out: <span id="stat-na" class="font-bold text-red-500 text-sm">0</span></div>
                    <div>K+ Moved In: <span id="stat-k" class="font-bold text-blue-500 text-sm">0</span></div>
                    <div>ATP Used: <span id="stat-atp" class="font-bold text-yellow-600 text-sm">0</span></div>
                </div>
            </div>
            
            <div class="flex-grow relative w-full h-full p-2" id="canvas-container">
                <canvas id="sim-canvas"></canvas>
            </div>
        </div>

        <!-- Right Side: Info & Controls Panel -->
        <div class="w-full md:w-80 flex flex-col gap-4 overflow-y-auto">
            
            <div class="bg-white p-5 rounded-xl shadow-lg border border-slate-200 shrink-0">
                <h3 class="text-sm uppercase tracking-wider font-bold text-slate-400 mb-4">Simulation Controls</h3>
                
                <!-- Pump Controls (5 Steps + Auto) -->
                <div id="controls-pump" class="flex flex-col gap-2">
                    <div class="flex items-center justify-between mb-2 bg-slate-50 p-2 rounded border border-slate-100">
                        <span class="text-sm font-bold text-slate-700">Auto Mode Loop</span>
                        <label class="relative inline-flex items-center cursor-pointer">
                          <input type="checkbox" id="auto-toggle" class="sr-only peer" onchange="toggleAutoMode(this.checked)">
                          <div class="w-9 h-5 bg-slate-300 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-blue-600"></div>
                        </label>
                    </div>
                    <button id="btn-step1" onclick="triggerPumpStep(1)" class="btn w-full py-2 bg-blue-500 hover:bg-blue-600 text-white font-bold rounded shadow-sm text-sm">1. Bind Na+</button>
                    <button id="btn-step2" onclick="triggerPumpStep(2)" class="btn w-full py-2 bg-yellow-500 hover:bg-yellow-600 text-white font-bold rounded shadow-sm text-sm" disabled>2. Bind ATP</button>
                    <button id="btn-step3" onclick="triggerPumpStep(3)" class="btn w-full py-2 bg-emerald-500 hover:bg-emerald-600 text-white font-bold rounded shadow-sm text-sm" disabled>3. Release Na+</button>
                    <button id="btn-step4" onclick="triggerPumpStep(4)" class="btn w-full py-2 bg-indigo-500 hover:bg-indigo-600 text-white font-bold rounded shadow-sm text-sm" disabled>4. Bind K+</button>
                    <button id="btn-step5" onclick="triggerPumpStep(5)" class="btn w-full py-2 bg-purple-500 hover:bg-purple-600 text-white font-bold rounded shadow-sm text-sm" disabled>5. Release K+</button>
                    <button onclick="triggerAction('reset')" class="btn w-full mt-2 py-2 bg-slate-200 hover:bg-slate-300 text-slate-700 font-semibold rounded text-sm">Reset Simulation</button>
                </div>

                <!-- Endo Controls -->
                <div id="controls-endo" class="flex flex-col gap-3 hidden">
                    <button id="btn-engulf" onclick="triggerAction('engulf')" class="btn w-full py-3 bg-emerald-500 hover:bg-emerald-600 text-white font-bold rounded shadow-sm">Engulf Particle</button>
                    <button onclick="triggerAction('reset')" class="btn w-full mt-2 py-2 bg-slate-200 hover:bg-slate-300 text-slate-700 font-semibold rounded text-sm">Reset Simulation</button>
                </div>

                <!-- Exo Controls -->
                <div id="controls-exo" class="flex flex-col gap-3 hidden">
                    <button id="btn-release" onclick="triggerAction('release')" class="btn w-full py-3 bg-emerald-500 hover:bg-emerald-600 text-white font-bold rounded shadow-sm">Release Contents</button>
                    <button onclick="triggerAction('reset')" class="btn w-full mt-2 py-2 bg-slate-200 hover:bg-slate-300 text-slate-700 font-semibold rounded text-sm">Reset Simulation</button>
                </div>
            </div>

            <div class="bg-white p-5 rounded-xl shadow-lg border border-slate-200 flex-grow shrink-0">
                <h3 class="text-sm uppercase tracking-wider font-bold text-slate-400 mb-2">Mechanism</h3>
                <div id="info-text" class="text-slate-600 text-sm leading-relaxed space-y-3"></div>
            </div>
        </div>
    </main>

    <script>
        const canvas = document.getElementById('sim-canvas');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('canvas-container');
        
        let currentModule = 'pump';
        let width, height, cx, cy;
        let animationId;
        let lastTime = 0;
        let pumpStats = { na: 0, k: 0, atp: 0 };

        const COLORS = {
            ecf: '#dbeafe', icf: '#fef9c3', membrane: '#94a3b8', head: '#475569',
            pump: '#8b5cf6', na: '#ef4444', k: '#3b82f6', atp: '#eab308',
            particle: '#22c55e', exoParticle: '#d946ef'
        };

        const CONTENT = {
            pump: {
                title: "Sodium-Potassium Pump",
                legend: `
                    <div class="flex items-center gap-2"><div class="w-3 h-3 rounded-full bg-[${COLORS.na}]"></div> Na+ (Sodium)</div>
                    <div class="flex items-center gap-2"><div class="w-3 h-3 rounded-full bg-[${COLORS.k}]"></div> K+ (Potassium)</div>
                    <div class="flex items-center gap-2"><div class="w-3 h-3 bg-[${COLORS.atp}] rotate-45 transform"></div> ATP / P</div>
                `,
                text: `
                    <p><strong>Primary Active Transport</strong> moves ions across a cell membrane against their concentration gradient, requiring energy (ATP).</p>
                    <ol class="list-decimal pl-4 space-y-1 mt-2">
                        <li>Three <strong>Na+</strong> ions from inside the cell bind to the pump.</li>
                        <li><strong>ATP</strong> binds, transferring a phosphate group (phosphorylation) and energy to the pump.</li>
                        <li>The pump changes shape, releasing the 3 Na+ outside.</li>
                        <li>Two <strong>K+</strong> ions from outside bind to the pump.</li>
                        <li>The phosphate is released, the pump reverts to its original shape, and the 2 K+ are released inside.</li>
                    </ol>
                `
            },
            endo: {
                title: "Endocytosis",
                legend: `<div class="flex items-center gap-2"><div class="w-3 h-3 rounded-sm bg-[${COLORS.particle}]"></div> Extracellular Particle</div>`,
                text: `<p><strong>Endocytosis</strong> is bulk active transport where a cell takes in large particles by engulfing them in an invagination of its membrane, forming a vesicle.</p>`
            },
            exo: {
                title: "Exocytosis",
                legend: `<div class="flex items-center gap-2"><div class="w-3 h-3 rounded-full bg-[${COLORS.exoParticle}]"></div> Secretory Product</div>`,
                text: `<p><strong>Exocytosis</strong> is the reverse of endocytosis. Materials packaged in a vesicle fuse with the plasma membrane to expel contents outside the cell.</p>`
            }
        };

        function resizeCanvas() {
            const rect = container.getBoundingClientRect();
            const dpr = window.devicePixelRatio || 1;
            canvas.width = rect.width * dpr;
            canvas.height = rect.height * dpr;
            ctx.scale(dpr, dpr);
            width = rect.width; height = rect.height;
            cx = width / 2; cy = height / 2;
            canvas.style.background = `linear-gradient(to bottom, ${COLORS.ecf} 0%, ${COLORS.ecf} ${cy}px, ${COLORS.icf} ${cy}px, ${COLORS.icf} 100%)`;
            initModuleState();
        }
        window.addEventListener('resize', resizeCanvas);

        let simState = {}; 

        function updateStatsUI() {
            document.getElementById('stat-na').innerText = pumpStats.na;
            document.getElementById('stat-k').innerText = pumpStats.k;
            document.getElementById('stat-atp').innerText = pumpStats.atp;
        }

        function initModuleState() {
            simState = {
                time: 0,
                ions: [],
                // Pump state machine: 0(idle), 1(bindNa), 1.5(wait), 2(bindATP), 2.5(wait), 3(releaseNa), 3.5(wait), 4(bindK), 4.5(wait), 5(releaseK)
                pumpState: 0, 
                pumpAnimProgress: 0, // 0 = open inside, 1 = open outside
                waitTimer: 0,
                autoMode: document.getElementById('auto-toggle') ? document.getElementById('auto-toggle').checked : false,
                atp: { active: false, x: 0, y: 0, isAdp: false },
                pi: { active: false, attached: false, x: 0, y: 0, vx: 0, vy: 0 },
                
                // Endo/Exo specific
                animProgress: 0,
                isAnimating: false
            };

            if (currentModule === 'pump') {
                pumpStats = { na: 0, k: 0, atp: 0 };
                updateStatsUI();
                
                // Generate ambient ions
                for(let i=0; i<25; i++) {
                    simState.ions.push({ type: 'Na', x: Math.random()*width, y: Math.random()*(cy-60), fixed: false, r: 8, vy: (Math.random()-0.5)*1, vx: (Math.random()-0.5)*1 });
                    simState.ions.push({ type: 'K', x: Math.random()*width, y: cy+60 + Math.random()*(height-cy-60), fixed: false, r: 8, vy: (Math.random()-0.5)*1, vx: (Math.random()-0.5)*1 });
                }

                setupNextCycleIons();
            }
            
            if (currentModule === 'endo') simState.particle = { x: cx, y: cy - 120, size: 20 };
            
            if (currentModule === 'exo') {
                simState.vesicleY = cy + 120;
                simState.exoParticles = [];
                for(let i=0; i<8; i++) {
                    let angle = Math.random() * Math.PI * 2; let r = Math.random() * 15;
                    simState.exoParticles.push({ xOffset: Math.cos(angle)*r, yOffset: Math.sin(angle)*r, globalX: 0, globalY: 0, released: false, vx: (Math.random()-0.5)*2, vy: -1 - Math.random() });
                }
            }
        }

        // Helper to grab random ambient ions and assign them as actors for the next cycle
        function setupNextCycleIons() {
            simState.atp = { active: false, x: cx - 100, y: height - 50, isAdp: false };
            simState.pi = { active: false, attached: false, x: 0, y: 0, vx: 0, vy: 0 };

            let freeNaInside = simState.ions.filter(i => !i.fixed && !i.id && i.type === 'Na' && i.y > cy + 20);
            while(freeNaInside.length < 3) {
                let n = { type: 'Na', x: cx + (Math.random()-0.5)*100, y: height - 20, fixed: false, r: 8, vx:(Math.random()-0.5), vy:(Math.random()-0.5) };
                simState.ions.push(n); freeNaInside.push(n);
            }
            freeNaInside[0].id = 'na1'; freeNaInside[0].targetX = cx - 20; freeNaInside[0].targetY = cy + 5; freeNaInside[0].outX = cx - 40; freeNaInside[0].outY = cy - 80;
            freeNaInside[1].id = 'na2'; freeNaInside[1].targetX = cx; freeNaInside[1].targetY = cy + 15; freeNaInside[1].outX = cx; freeNaInside[1].outY = cy - 100;
            freeNaInside[2].id = 'na3'; freeNaInside[2].targetX = cx + 20; freeNaInside[2].targetY = cy + 5; freeNaInside[2].outX = cx + 40; freeNaInside[2].outY = cy - 80;

            let freeKOutside = simState.ions.filter(i => !i.fixed && !i.id && i.type === 'K' && i.y < cy - 20);
            while(freeKOutside.length < 2) {
                let k = { type: 'K', x: cx + (Math.random()-0.5)*100, y: 20, fixed: false, r: 8, vx:(Math.random()-0.5), vy:(Math.random()-0.5) };
                simState.ions.push(k); freeKOutside.push(k);
            }
            freeKOutside[0].id = 'k1'; freeKOutside[0].targetX = cx - 15; freeKOutside[0].targetY = cy - 10; freeKOutside[0].inX = cx - 60; freeKOutside[0].inY = cy + 80;
            freeKOutside[1].id = 'k2'; freeKOutside[1].targetX = cx + 15; freeKOutside[1].targetY = cy - 10; freeKOutside[1].inX = cx + 60; freeKOutside[1].inY = cy + 80;
        }

        function moveTowards(obj, tx, ty, speed) {
            let dx = tx - obj.x; let dy = ty - obj.y;
            let dist = Math.hypot(dx, dy);
            if (dist <= speed) { obj.x = tx; obj.y = ty; return true; }
            obj.x += (dx/dist)*speed; obj.y += (dy/dist)*speed;
            return false;
        }

        function drawMembrane(yOffset, dipDepth = 0, dipWidth = 80, gap = 0, breakOpen = false) {
            ctx.fillStyle = COLORS.membrane;
            ctx.beginPath();
            if (dipDepth === 0) {
                ctx.rect(0, yOffset - 15, width, 30);
                ctx.fillStyle = '#cbd5e1'; ctx.fill();
            } else {
                ctx.lineWidth = 16; ctx.strokeStyle = '#cbd5e1';
                let startGap = cx - dipWidth/2 - gap; let endGap = cx + dipWidth/2 + gap;
                ctx.beginPath(); ctx.moveTo(0, yOffset); ctx.lineTo(startGap, yOffset);
                if (!breakOpen) ctx.bezierCurveTo(startGap, yOffset + dipDepth*0.8, endGap, yOffset + dipDepth*0.8, endGap, yOffset);
                ctx.lineTo(width, yOffset); ctx.stroke();
            }
            drawLipidHeads(yOffset - 15, dipDepth, dipWidth, gap, breakOpen, -1);
            drawLipidHeads(yOffset + 15, dipDepth, dipWidth, gap, breakOpen, 1);
        }

        function drawLipidHeads(y, dipDepth, dipWidth, gap, breakOpen, direction) {
            let startGap = cx - dipWidth/2 - gap; let endGap = cx + dipWidth/2 + gap;
            let headRadius = 6; ctx.fillStyle = COLORS.head;
            for (let x = 0; x < width; x += headRadius * 2.5) {
                if (dipDepth === 0) {
                    if (currentModule === 'pump' && x > cx - 50 && x < cx + 50) continue;
                    ctx.beginPath(); ctx.arc(x, y, headRadius, 0, Math.PI * 2); ctx.fill();
                } else {
                    if (x > startGap && x < endGap) {
                        if (breakOpen) continue; 
                        let normalizedX = (x - startGap) / (endGap - startGap);
                        let curveY = y + direction*15 + Math.sin(normalizedX * Math.PI) * dipDepth;
                        let normalY = curveY - direction*15;
                        ctx.beginPath(); ctx.arc(x, normalY, headRadius, 0, Math.PI * 2); ctx.fill();
                    } else {
                        ctx.beginPath(); ctx.arc(x, y, headRadius, 0, Math.PI * 2); ctx.fill();
                    }
                }
            }
        }

        function drawProteinPump(progress) {
            ctx.save(); ctx.translate(cx, cy);
            ctx.fillStyle = COLORS.pump;
            let topWidth = 80; let bottomWidth = 80;
            let topGap = 20 + progress * 40; 
            let bottomGap = 60 - progress * 40; 

            ctx.beginPath(); ctx.moveTo(-topWidth/2, -40); ctx.lineTo(-topGap/2, -40); ctx.lineTo(-bottomGap/2, 40); ctx.lineTo(-bottomWidth/2, 40); ctx.closePath(); ctx.fill(); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(topWidth/2, -40); ctx.lineTo(topGap/2, -40); ctx.lineTo(bottomGap/2, 40); ctx.lineTo(bottomWidth/2, 40); ctx.closePath(); ctx.fill(); ctx.stroke();
            ctx.restore();
        }

        function drawLabels() {
            ctx.fillStyle = 'rgba(255,255,255,0.85)';
            ctx.fillRect(10, 10, 150, 25);
            ctx.fillRect(10, height - 35, 150, 25);
            ctx.textAlign = 'left';
            ctx.textBaseline = 'alphabetic';
            ctx.fillStyle = '#1e293b';
            ctx.font = '14px font-bold Arial';
            ctx.fillText('Extracellular Fluid', 20, 27);
            ctx.fillText('Cytoplasm (Inside)', 20, height - 18);
        }

        function advancePumpState(nextState, waitBtnId) {
            if (simState.autoMode) {
                simState.pumpState = nextState;
            } else {
                simState.pumpState = nextState - 0.5; // fractional wait state
                updateButtons(waitBtnId);
            }
        }

        function updateButtons(activeId) {
            ['btn-step1', 'btn-step2', 'btn-step3', 'btn-step4', 'btn-step5'].forEach(id => {
                document.getElementById(id).disabled = true;
            });
            if (activeId && !simState.autoMode) document.getElementById(activeId).disabled = false;
        }

        function toggleAutoMode(isAuto) {
            simState.autoMode = isAuto;
            if (isAuto && currentModule === 'pump') {
                updateButtons(null);
                // Bump waiting states to active
                if (simState.pumpState === 0) triggerPumpStep(1);
                if (simState.pumpState === 1.5) triggerPumpStep(2);
                if (simState.pumpState === 2.5) triggerPumpStep(3);
                if (simState.pumpState === 3.5) triggerPumpStep(4);
                if (simState.pumpState === 4.5) triggerPumpStep(5);
            } else if (!isAuto && currentModule === 'pump') {
                // If we uncheck it while active, it will naturally pause at the end of the current step
            }
        }

        function triggerPumpStep(stepNum) {
            if(simState.pumpState === 0 && stepNum === 1) { simState.pumpState = 1; updateButtons(null); }
            if(simState.pumpState === 1.5 && stepNum === 2) { simState.pumpState = 2; updateButtons(null); }
            if(simState.pumpState === 2.5 && stepNum === 3) { simState.pumpState = 3; updateButtons(null); }
            if(simState.pumpState === 3.5 && stepNum === 4) { simState.pumpState = 4; updateButtons(null); }
            if(simState.pumpState === 4.5 && stepNum === 5) { simState.pumpState = 5; updateButtons(null); }
        }

        function updateAndRenderPump(dt) {
            drawMembrane(cy, 0);
            let speed = 90 * dt; // ion movement speed

            // Background ions drift
            simState.ions.forEach(ion => {
                if (!ion.fixed && !ion.id) {
                    ion.x += ion.vx; ion.y += ion.vy;
                    if(ion.x < 0 || ion.x > width) ion.vx *= -1;
                    if (ion.type === 'Na' && ion.y < cy) { if (ion.y < 0) ion.vy *= -1; if (ion.y > cy - 20) ion.vy *= -1; } 
                    else if (ion.type === 'K' && ion.y > cy) { if (ion.y > height) ion.vy *= -1; if (ion.y < cy + 20) ion.vy *= -1; } 
                    else { if (ion.y < 0 || ion.y > height) ion.vy *= -1; }
                }
            });

            // State Machine
            if (simState.pumpState === 1) {
                let allBound = true;
                simState.ions.filter(i => i.id && i.type === 'Na').forEach(ion => {
                    ion.fixed = true;
                    if (!moveTowards(ion, ion.targetX, ion.targetY, speed)) allBound = false;
                });
                if (allBound) advancePumpState(2, 'btn-step2');
            } 
            else if (simState.pumpState === 2) {
                simState.atp.active = true;
                if (moveTowards(simState.atp, cx - 40, cy + 20, speed)) {
                    simState.waitTimer += dt;
                    if (simState.waitTimer > 0.5) { // Split ATP
                        simState.atp.isAdp = true;
                        simState.pi.active = true;
                        simState.pi.attached = true;
                        simState.waitTimer = 0;
                        advancePumpState(3, 'btn-step3');
                    }
                }
            }
            else if (simState.pumpState === 3) {
                if (simState.atp.isAdp) { simState.atp.x -= speed*0.5; simState.atp.y += speed*0.5; } // ADP drifts away
                
                simState.pumpAnimProgress += 2.5 * dt; // Animate to V inverted
                if (simState.pumpAnimProgress >= 1) {
                    simState.pumpAnimProgress = 1;
                    let allOut = true;
                    simState.ions.filter(i => i.id && i.type === 'Na').forEach(ion => {
                        if (!moveTowards(ion, ion.outX, ion.outY, speed)) allOut = false;
                    });
                    if (allOut) {
                        simState.ions.filter(i => i.id && i.type === 'Na').forEach(ion => {
                            ion.fixed = false; delete ion.id; ion.vx = (Math.random()-0.5)*2; ion.vy = -1 - Math.random()*2;
                            pumpStats.na++;
                        });
                        pumpStats.atp++;
                        updateStatsUI();
                        advancePumpState(4, 'btn-step4');
                    }
                }
            }
            else if (simState.pumpState === 4) {
                if (simState.atp.isAdp) { simState.atp.x -= speed*0.5; simState.atp.y += speed*0.5; }
                let allBound = true;
                simState.ions.filter(i => i.id && i.type === 'K').forEach(ion => {
                    ion.fixed = true;
                    if (!moveTowards(ion, ion.targetX, ion.targetY, speed)) allBound = false;
                });
                if (allBound) advancePumpState(5, 'btn-step5');
            }
            else if (simState.pumpState === 5) {
                if (simState.atp.isAdp) { simState.atp.x -= speed*0.5; simState.atp.y += speed*0.5; }
                
                simState.pi.attached = false;
                simState.pi.x -= speed*0.5; simState.pi.y += speed*0.5; // Pi floats away

                simState.pumpAnimProgress -= 2.5 * dt; // Animate to V normal
                if (simState.pumpAnimProgress <= 0) {
                    simState.pumpAnimProgress = 0;
                    let allIn = true;
                    simState.ions.filter(i => i.id && i.type === 'K').forEach(ion => {
                        if (!moveTowards(ion, ion.inX, ion.inY, speed)) allIn = false;
                    });
                    if (allIn) {
                        simState.ions.filter(i => i.id && i.type === 'K').forEach(ion => {
                            ion.fixed = false; delete ion.id; ion.vx = (Math.random()-0.5)*2; ion.vy = 1 + Math.random()*2;
                            pumpStats.k++;
                        });
                        updateStatsUI();
                        setupNextCycleIons();
                        
                        if (simState.autoMode) {
                            simState.pumpState = 1; // loop
                        } else {
                            simState.pumpState = 0; // stop
                            updateButtons('btn-step1');
                        }
                    }
                }
            } else if (simState.pumpState % 1 !== 0) {
                // In a wait state, keep floating ADP/Pi moving if they exist
                if (simState.atp.isAdp) { simState.atp.x -= speed*0.2; simState.atp.y += speed*0.2; }
            }

            drawProteinPump(simState.pumpAnimProgress);

            // Draw Ions
            simState.ions.forEach(ion => {
                ctx.fillStyle = ion.type === 'Na' ? COLORS.na : COLORS.k;
                ctx.beginPath(); ctx.arc(ion.x, ion.y, ion.r, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = 'white'; ctx.font = '10px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('+', ion.x, ion.y);
            });

            // Draw ATP / ADP
            if (simState.atp.active) {
                ctx.fillStyle = COLORS.atp; ctx.save(); ctx.translate(simState.atp.x, simState.atp.y);
                ctx.rotate(Math.PI/4); ctx.fillRect(-10, -10, 20, 20); ctx.restore();
                ctx.fillStyle = 'black'; ctx.font = '12px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(simState.atp.isAdp ? 'ADP' : 'ATP', simState.atp.x, simState.atp.y);
            }

            // Draw attached or floating Pi
            if (simState.pi.active) {
                if (simState.pi.attached) {
                    // Lock position relative to pump
                    simState.pi.x = cx - 50;
                    simState.pi.y = cy + 20;
                }
                ctx.fillStyle = COLORS.atp;
                ctx.beginPath(); ctx.arc(simState.pi.x, simState.pi.y, 10, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = 'black'; ctx.font = '11px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('P', simState.pi.x, simState.pi.y);
            }

            drawLabels();
        }

        function updateAndRenderEndo(dt) {
            let speed = 0.5 * dt;
            if (simState.isAnimating) {
                simState.animProgress += speed;
                if (simState.animProgress > 1) { simState.animProgress = 1; simState.isAnimating = false; }
            }
            let p = simState.animProgress;
            let dipDepth = 0, gap = 0, breakOpen = false;

            if (p < 0.2) simState.particle.y = (cy - 120) + (p/0.2)*80;
            else if (p < 0.7) { dipDepth = ((p - 0.2) / 0.5) * 60; simState.particle.y = (cy - 40) + dipDepth; } 
            else if (p < 0.9) { let pinch = (p - 0.7) / 0.2; dipDepth = 60 - pinch * 60; gap = pinch * 10; breakOpen = true; simState.particle.y = (cy + 20) + pinch * 30; } 
            else { dipDepth = 0; breakOpen = false; simState.particle.y = cy + 50 + ((p - 0.9) / 0.1) * 20; }

            ctx.fillStyle = COLORS.particle;
            ctx.beginPath(); ctx.roundRect(simState.particle.x - 15, simState.particle.y - 15, 30, 30, 5); ctx.fill();

            if (p >= 0.7) {
                let pinchP = Math.min(1, Math.max(0, (p - 0.7) / 0.2));
                let vesicleY = p >= 0.9 ? simState.particle.y : (cy + 20) + pinchP * 30;
                ctx.strokeStyle = COLORS.membrane; ctx.lineWidth = 12; ctx.beginPath(); ctx.arc(cx, vesicleY, 30, 0, Math.PI*2); ctx.stroke();
                ctx.fillStyle = COLORS.head;
                for(let a=0; a<Math.PI*2; a+=0.5) { ctx.beginPath(); ctx.arc(cx + Math.cos(a)*(24), vesicleY + Math.sin(a)*(24), 4, 0, Math.PI*2); ctx.fill(); }
                for(let a=0; a<Math.PI*2; a+=0.4) { ctx.beginPath(); ctx.arc(cx + Math.cos(a)*(36), vesicleY + Math.sin(a)*(36), 4, 0, Math.PI*2); ctx.fill(); }
            }

            drawMembrane(cy, dipDepth, 80, gap, breakOpen);
            drawLabels();
        }

        function updateAndRenderExo(dt) {
            let speed = 0.4 * dt;
            if (simState.isAnimating) {
                simState.animProgress += speed;
                if (simState.animProgress > 1) { simState.animProgress = 1; simState.isAnimating = false; }
            }
            let p = simState.animProgress;
            let vesicleY = cy + 120, dipDepth = 0, breakOpen = false, gap = 0, vR = 35;

            if (p < 0.3) vesicleY = (cy + 120) - (p/0.3)*80;
            else if (p < 0.6) { vesicleY = cy + 40; let openP = (p - 0.3)/0.3; dipDepth = openP * 40; breakOpen = true; gap = openP * 30; vR = 35 + openP*20; } 
            else if (p < 0.9) { vesicleY = cy + 40; let flatP = (p - 0.6)/0.3; dipDepth = 40 - flatP * 40; gap = 30 + flatP * 50; breakOpen = true; if (flatP > 0.8) gap = 0; }

            if (p < 0.9) {
                ctx.strokeStyle = COLORS.membrane; ctx.lineWidth = 12;
                if (p < 0.3) { ctx.beginPath(); ctx.arc(cx, vesicleY, vR, 0, Math.PI*2); ctx.stroke(); } 
                else { ctx.beginPath(); ctx.arc(cx, vesicleY, vR, Math.PI + 0.5, Math.PI*2 - 0.5, true); ctx.stroke(); }
                ctx.fillStyle = COLORS.head;
                for(let a=0; a<Math.PI*2; a+=0.4) {
                    if (p >= 0.3 && a > Math.PI && a < Math.PI*2) continue;
                    ctx.beginPath(); ctx.arc(cx + Math.cos(a)*(vR-6), vesicleY + Math.sin(a)*(vR-6), 4, 0, Math.PI*2); ctx.fill();
                    ctx.beginPath(); ctx.arc(cx + Math.cos(a)*(vR+6), vesicleY + Math.sin(a)*(vR+6), 4, 0, Math.PI*2); ctx.fill();
                }
            }

            drawMembrane(cy, -dipDepth, gap*2, gap, breakOpen);

            simState.exoParticles.forEach(particle => {
                if (p < 0.3) { particle.globalX = cx + particle.xOffset; particle.globalY = vesicleY + particle.yOffset; } 
                else if (p >= 0.3 && !particle.released) { particle.released = true; }
                if (particle.released) { particle.globalX += particle.vx; particle.globalY += particle.vy; }
                ctx.fillStyle = COLORS.exoParticle; ctx.beginPath(); ctx.arc(particle.globalX, particle.globalY, 6, 0, Math.PI*2); ctx.fill();
            });
            
            drawLabels();
        }

        function render(time) {
            let dt = (time - lastTime) / 1000;
            if (dt > 0.1) dt = 0.1;
            lastTime = time;

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            if (currentModule === 'pump') updateAndRenderPump(dt);
            else if (currentModule === 'endo') updateAndRenderEndo(dt);
            else if (currentModule === 'exo') updateAndRenderExo(dt);

            animationId = requestAnimationFrame(render);
        }

        function setModule(mod) {
            currentModule = mod;
            document.querySelectorAll('nav button').forEach(btn => {
                btn.classList.remove('ring-white'); btn.classList.replace('bg-blue-700', 'bg-blue-500');
            });
            const activeTab = document.getElementById(`tab-${mod}`);
            activeTab.classList.replace('bg-blue-500', 'bg-blue-700'); activeTab.classList.add('ring-white');

            if (mod === 'pump') document.getElementById('pump-scoreboard').classList.remove('hidden');
            else document.getElementById('pump-scoreboard').classList.add('hidden');

            document.getElementById('controls-pump').classList.add('hidden');
            document.getElementById('controls-endo').classList.add('hidden');
            document.getElementById('controls-exo').classList.add('hidden');
            document.getElementById(`controls-${mod}`).classList.remove('hidden');

            const content = CONTENT[mod];
            document.getElementById('canvas-title').innerText = content.title;
            document.getElementById('legend').innerHTML = content.legend;
            
            const infoEl = document.getElementById('info-text');
            infoEl.innerHTML = content.text;
            infoEl.classList.remove('fade-in'); void infoEl.offsetWidth; infoEl.classList.add('fade-in');

            initModuleState();
            
            if (mod === 'pump') updateButtons(document.getElementById('auto-toggle').checked ? null : 'btn-step1');
            if (mod === 'endo') document.getElementById('btn-engulf').disabled = false;
            if (mod === 'exo') document.getElementById('btn-release').disabled = false;
        }

        function triggerAction(action) {
            if (action === 'reset') {
                if(currentModule === 'pump' && document.getElementById('auto-toggle')) {
                    document.getElementById('auto-toggle').checked = false;
                }
                initModuleState();
                if (currentModule === 'pump') updateButtons('btn-step1');
                else if (currentModule === 'endo') document.getElementById('btn-engulf').disabled = false;
                else if (currentModule === 'exo') document.getElementById('btn-release').disabled = false;
            } else if (action === 'engulf' && !simState.isAnimating) {
                simState.isAnimating = true; document.getElementById('btn-engulf').disabled = true;
            } else if (action === 'release' && !simState.isAnimating) {
                simState.isAnimating = true; document.getElementById('btn-release').disabled = true;
            }
        }

        window.onload = () => {
            resizeCanvas();
            setModule('pump');
            requestAnimationFrame(render);
        };
    </script>
</body>
</html>
